      name="description"
      content="كوركت لخدمات المحاسبة — شريكك الموثوق في الأرقام. مسك الدفاتر، المراجعة، الضرائب، تطبيق أنظمة تخطيط الموارد، والاستشارات المالية."
    />
    <title>كوركت لخدمات المحاسبة</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('theme');
        var isDark =
          storedTheme === 'dark' ||
          (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');

        var storedLang = localStorage.getItem('lang');
        var lang = storedLang === 'en' || storedLang === 'ar' ? storedLang : 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
